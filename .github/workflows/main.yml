name: D1 Otomatik Guncelleme

on:
  schedule:
    - cron: '0 0 * * *' # Gece 03:00 TSİ
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - run: pip install requests
      - name: D1'i Guncelle
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_ID: ${{ secrets.CF_D1_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }} # <--- EKSİK OLAN VE SİSTEMİ ÇALIŞTIRACAK SATIR BU!
        run: python update_list.py
