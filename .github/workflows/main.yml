name: IPTV Guncelleme

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *' # 6 saatte bir otomatik çalışır
  workflow_dispatch: # Elle tetiklemek için

jobs:
  build:
    runs-on: windows-latest # Sıra beklemeyen boş sunucu
    
    defaults:
      run:
        shell: bash # 👈 USTA: HATA VEREN YERİ DÜZELTEN SİHİRLİ SATIR BURASI! 
                    # Windows üzerinde Linux komutlarını hatasız çalıştırır.

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: IPTV Temizlik Kodunu Çalıştır
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python kod.py # ⚠️ USTA: Burada 'kod.py' yazan yere senin python dosyanın adı neyse (main.py, iptv.py vb.) onu yaz!

      - name: Değişiklikleri Kaydet ve Pushla
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add tr.m3u
          git commit -m "IPTV Otomatik Güncellendi ($(date +'%d-%m-%Y %H:%M'))" || echo "Değişiklik yok, pass geçiliyor."
          git push
