name: IPTV Guncelleme

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        
      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Gerekli Paketleri Kur
        run: pip install requests
        
      - name: Botu Calistir (Dosyayi Hazirla)
        run: python update_list.py

      - name: Degisiklikleri Kaydet (Push)
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add tr.m3u
          git commit -m "♻️ Liste Guncellendi" || exit 0
          git push
