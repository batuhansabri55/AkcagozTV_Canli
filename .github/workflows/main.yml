name: IPTV Otomatik Guncelleme

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v3

      - name: Python Hazirla
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Paketleri Kur
        run: |
          python -m pip install --upgrade pip
          pip install streamlink

      - name: Botu Calistir
        run: python update_list.py

      - name: Degisiklikleri Kaydet ve Yukle
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Liste Guncellendi: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
          git push
