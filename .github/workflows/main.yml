name: IPTV Guncelleme

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          
      - name: Gerekli Paketleri Kur
        run: pip install requests
        
      - name: Botu Calistir (Dosyayı Hazırla)
        run: python update_list.py

      - name: Degisiklikleri Kaydet (Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -f tr.m3u
          
          git commit -m "♻️ Liste Guncellendi" || echo "Degisiklik yok"
          
          git push origin main --force
