name: IPTV Guncelleme

on:
  schedule:
    - cron: '0 */6 * * *' # Her 6 saatte bir otomatik çalışır
  workflow_dispatch: # El ile başlatma butonu

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        
      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Gerekli Paketleri Kur
        run: pip install requests
        
      - name: Botu Calistir
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python update_list.py
