name: IPTV Otomatik Guncelleme

on:
  schedule:
    - cron: '0 */3 * * *' # Her 3 saatte bir otomatik calisir
  workflow_dispatch:      # Manuel calistirma butonu ekler

permissions:
  contents: write         # Yazma yetkisi (Dosyalarin güncellenmesi icin sart)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Kopyala
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Bagimliliklari Yukle
        run: |
          python -m pip install --upgrade pip
          pip install streamlink

      - name: Kanallari Guncelle
        run: python update_list.py

      - name: Degisiklikleri Kaydet ve Yukle
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Liste Guncellendi: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
          git push
