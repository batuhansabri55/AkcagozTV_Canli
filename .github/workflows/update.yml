name: IPTV Liste Guncelleme

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Paketleri Kur
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp requests urllib3

      - name: Botu Calistir (Dosyayı Hazırla)
        run: |
          python update_list.py

      - name: Degisiklikleri Kaydet (Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "🔄 Liste Otomatik Güncellendi" && git push)
